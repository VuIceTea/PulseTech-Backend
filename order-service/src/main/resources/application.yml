spring:
  application:
    name: order-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/PulseTech}
    database: PulseTech
server:
  port: ${PORT:8083}
services:
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
  auth:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8080}
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  vnpay:
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/orders/payment/vnpay_return}
management:
  endpoints:
    web:
      exposure:
        include: health,info
