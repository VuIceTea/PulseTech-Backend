spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/products/**,/api/content/**
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/auth/**
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/orders/**,/api/cart/**
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${FRONTEND_URL:http://localhost:3000}
                allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
                allowedHeaders: '*'
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
