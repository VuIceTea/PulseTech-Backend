spring:
  application:
    name: auth-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/PulseTech}
    database: PulseTech
  data:
    mongodb:
      auto-index-creation: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:example@gmail.com}
    password: ${MAIL_PASSWORD:password}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
server:
  port: ${PORT:8082}
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail-from: ${MAIL_FROM:example@gmail.com}
  jwt-secret: ${JWT_SECRET:change-this-development-secret-before-production-123456}
  jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:12}
  admin-emails: ${ADMIN_EMAILS:}
  internal-api-key: ${INTERNAL_API_KEY:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
